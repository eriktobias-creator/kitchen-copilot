# Generate the Xcode project on your Mac (needs Xcode 26.4+ for the Meta toolkit):
#   brew install xcodegen && cd ios && xcodegen
name: KitchenCopilot
options:
  bundleIdPrefix: com.example.kitchencopilot   # change "example" to your name
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""   # set in Xcode: Signing & Capabilities -> Team
targets:
  KitchenCopilot:
    type: application
    platform: iOS
    sources: [KitchenCopilot]
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATSpeech
      - package: MetaWearables
        product: MWDATInputs
    info:
      path: KitchenCopilot/Info.plist
      properties:
        CFBundleDisplayName: Kitchen Copilot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSMicrophoneUsageDescription: Listens for your questions through your glasses or phone mic.
        NSSpeechRecognitionUsageDescription: Turns your voice into text on this iPhone so the assistant can answer.
        # Lets the app reach the server on your Mac over Wi-Fi (http://Your-Mac.local:8787)
        # while testing. Real use should be an https:// server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Finds your glasses over Wi-Fi and reaches your Kitchen Copilot server while testing.

        # --- Meta Wearables Device Access Toolkit (matches Meta's sample apps) ---
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [kitchencopilot]
        MWDAT:
          AppLinkURLScheme: "kitchencopilot://"
          # "0" = Developer Mode (no Meta app ID needed for personal use).
          MetaAppID: "0"
          ClientToken: "0"
          TeamID: $(DEVELOPMENT_TEAM)
        UIBackgroundModes:
          - audio
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Meta glasses.
        NSBonjourServices: [_bonjour._tcp]
